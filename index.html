        /* Custom Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background-color: #f3f4f6; /* Abu-abu terang */
        }

        /* --- Animasi Background Gelembung --- */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Paling belakang */
            overflow: hidden;
            background: linear-gradient(180deg, #fce7f3 0%, #e5e7eb 100%);
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: rgba(236, 72, 153, 0.4);
            border-radius: 50%;
            animation: rise infinite ease-in;
        }

        @keyframes rise {
            0% { bottom: -100px; transform: translateX(0); opacity: 0.6; }
            50% { opacity: 1; }
            100% { bottom: 120vh; transform: translateX(100px); opacity: 0; }
        }

        /* --- Animasi Karakter Melayang --- */
        .floating-char {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        /* Fade Effect */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>

    <script>
        // --- Logic Bubbles ---
        const bubbleContainer = document.getElementById('bubble-container');
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = Math.random() * 60 + 20 + 'px';
            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = Math.random() * 5 + 5 + 's';
            bubble.style.animationDelay = Math.random() * 5 + 's';
            bubbleContainer.appendChild(bubble);
            setTimeout(() => { bubble.remove(); }, 10000); 
        }
        for(let i=0; i<15; i++) createBubble();
        setInterval(createBubble, 1000);

        // --- Logic Slide Teks ---
        const textElement = document.getElementById('text-slide');
        const texts = [
            "🎫 list harga ada dibawah 🎫",
            "🚀 Jangan lupa follow channel whatsapp 🚀",
            "💸 Rental bot: 200k setahun 💸",
            " 🌀 Rental bot: 15k sebulan 🌀"
        ];
        let textIndex = 0;
        setInterval(() => {
            textElement.style.opacity = '0';
            textElement.style.transform = 'translateY(5px)';
            setTimeout(() => {
                textIndex = (textIndex + 1) % texts.length;
                textElement.innerText = texts[textIndex];
                textElement.style.opacity = '1';
                textElement.style.transform = 'translateY(0)';
            }, 500);
        }, 4000);

        // --- Logic Toggle Opsi ---
        function toggleOptions() {
            const hiddenLinks = document.getElementById('hidden-links');
            const chevron = document.getElementById('chevron-icon');
            if (hiddenLinks.classList.contains('hidden')) {
                hiddenLinks.classList.remove('hidden');
                hiddenLinks.classList.add('flex');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                hiddenLinks.classList.add('hidden');
                hiddenLinks.classList.remove('flex');
                chevron.style.transform = 'rotate(0deg)';
            }
        }
